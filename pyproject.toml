[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-cost-guard"
version = "1.0.0"
description = "Read-only AWS infrastructure cost optimization assessment CLI"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34,<2.0"]

[project.scripts]
cloud-cost-guard = "cloud_cost_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
